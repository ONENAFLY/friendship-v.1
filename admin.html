<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - สมุดบันทึก ANAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Sriracha&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --sky-deep: #2d6a9f;
            --ink-dark: #0d2d42;
            --paper: #fefcf3;
            --accent-coral: #e8a87c;
            --correct-green: #10b981;
            --wrong-red: #ef4444;
        }
        
        * { font-family: 'Kanit', sans-serif; }
        .font-handwrite { font-family: 'Sriracha', cursive; }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }
        
        .login-card {
            background: var(--paper);
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4);
        }
        
        .entry-card {
            background: var(--paper);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        
        .entry-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #38bdf8 0%, #2d6a9f 100%);
            color: white;
            padding: 12px 32px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover { transform: translateY(-2px); }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef5350, #c62828);
            color: white;
            padding: 8px 20px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.active { display: flex; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ink-dark);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .toast.show { opacity: 1; }
        .toast.success { background: var(--correct-green); }
        .toast.error { background: var(--wrong-red); }
        
        /* Demo Mode Banner */
        .demo-banner {
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            color: #78350f;
            padding: 8px 16px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    
    <!-- Demo Mode Banner -->
    <div id="demo-banner" class="demo-banner hidden">
        โหมดทดสอบ: ข้อมูลจากเครื่องนี้เท่านั้น (จะไม่เห็นข้อมูลจากคนอื่น)
    </div>
    
    <div id="toast" class="toast"></div>

    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
        <div class="login-card p-8 w-full max-w-md text-center">
            <div class="w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center" style="background: linear-gradient(135deg, #14b8a6, #38bdf8);">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <h1 class="font-handwrite text-3xl mb-2" style="color: var(--ink-dark);">Admin Panel</h1>
            <p class="mb-6" style="color: #666;">สมุดบันทึกความทรงจำของ ANAS</p>
            
            <div class="mb-4">
                <input type="password" id="admin-password" placeholder="ใส่รหัสผ่าน" class="w-full p-4 rounded-xl border-2 text-center" style="border-color: #ddd;">
            </div>
            
            <button onclick="checkPassword()" class="btn-primary w-full text-lg">เข้าสู่ระบบ</button>
            
            <p id="login-error" class="mt-4 text-red-500 hidden">รหัสผ่านไม่ถูกต้อง</p>
        </div>
    </div>
    
    <!-- Main Admin Panel -->
    <div id="admin-panel" class="hidden min-h-screen p-4 md:p-8">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="font-handwrite text-3xl text-white">รายการบันทึกทั้งหมด</h1>
                    <p class="text-white/50 text-sm mt-1">เฉพาะ ANAS เท่านั้นที่เข้าดูหน้านี้ได้</p>
                </div>
                <button onclick="logout()" class="text-white/70 hover:text-white bg-white/10 px-4 py-2 rounded-lg transition-colors">
                    ออกจากระบบ
                </button>
            </div>
            
            <div class="mb-4 text-white/60 flex gap-4">
                <span>ทั้งหมด: <span id="total-count" class="font-bold text-white">0</span> รายการ</span>
            </div>
            
            <div id="entries-list" class="space-y-4"></div>
            
            <div id="empty-state" class="text-center py-12 text-white/40 hidden">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="mx-auto mb-4 opacity-50">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
                <p class="font-handwrite text-xl">ยังไม่มีบันทึก</p>
                <p class="text-sm mt-2">เมื่อมีเพื่อนเขียนข้อความ จะแสดงที่นี่</p>
            </div>
        </div>
    </div>
    
    <!-- Modal View -->
    <div id="modal-view" class="modal">
        <div class="bg-white rounded-3xl p-6 md:p-8 w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold" style="background: linear-gradient(135deg, #b8dff5, #2d6a9f);" id="view-avatar">?</div>
                    <span class="font-handwrite text-xl" id="view-name">ผู้เขียน</span>
                </div>
                <button onclick="hideModal()" class="p-2 rounded-full hover:bg-gray-100 text-gray-500">✕</button>
            </div>
            
            <div class="mb-4 bg-yellow-50 p-4 rounded-xl border border-yellow-200">
                <p class="font-handwrite text-lg leading-relaxed" style="color: var(--ink-dark);" id="view-content">ข้อความ</p>
            </div>
            
            <div id="view-image-container" class="mb-4 hidden">
                <img id="view-image" class="max-w-full h-auto rounded-lg shadow-md">
            </div>
            
            <p class="text-sm text-gray-500" id="view-date">วันที่:</p>
        </div>
    </div>

    <script>
        // ==================== CONFIG ====================
        // เปลี่ยนรหัสผ่าน Admin ได้ที่นี่
        const ADMIN_PASSWORD = "anas1234";
        
        // Firebase Config (ต้องเหมือนใน index.html)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // ==================== GLOBAL ====================
        const IS_DEMO_MODE = firebaseConfig.apiKey === "YOUR_API_KEY";
        const STORAGE_KEY = 'anas_journal_entries';
        
        let db = null;
        let firebaseReady = false;
        let entries = [];
        
        // ==================== TOAST ====================
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + type;
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        
        // ==================== INIT SYSTEM ====================
        function initSystem() {
            if (IS_DEMO_MODE) {
                console.log('Admin Demo Mode: Reading from localStorage');
                document.getElementById('demo-banner').classList.remove('hidden');
            } else {
                console.log('Admin Firebase Mode');
                document.getElementById('demo-banner').classList.add('hidden');
                try {
                    firebase.initializeApp(firebaseConfig);
                    db = firebase.database();
                    firebaseReady = true;
                } catch (e) {
                    console.error('Firebase Init Error:', e);
                    showToast('เชื่อม Firebase ล้มเหลว', 'error');
                }
            }
        }
        
        // ==================== PASSWORD CHECK ====================
        function checkPassword() {
            const input = document.getElementById('admin-password').value;
            if (input === ADMIN_PASSWORD) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadEntries();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
                document.getElementById('admin-password').value = '';
            }
        }
        
        document.getElementById('admin-password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });
        
        // ==================== LOAD ENTRIES ====================
        function loadEntries() {
            if (IS_DEMO_MODE || !firebaseReady) {
                // Read from localStorage
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    entries = saved ? JSON.parse(saved) : [];
                    entries.sort((a, b) => new Date(b.date) - new Date(a.date));
                } catch { entries = []; }
                renderEntries();
            } else {
                // Listen to Firebase
                db.ref('entries').on('value', (snap) => {
                    const data = snap.val();
                    if (data) {
                        entries = Object.values(data);
                        entries.sort((a, b) => new Date(b.date) - new Date(a.date));
                    } else {
                        entries = [];
                    }
                    renderEntries();
                });
            }
        }
        
        // ==================== RENDER ====================
        function renderEntries() {
            const list = document.getElementById('entries-list');
            const empty = document.getElementById('empty-state');
            
            document.getElementById('total-count').textContent = entries.length;
            
            if (entries.length === 0) {
                list.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            
            empty.classList.add('hidden');
            list.innerHTML = '';
            
            entries.forEach((e, idx) => {
                const card = document.createElement('div');
                card.className = 'entry-card p-5';
                card.innerHTML = `
                    <div class="flex flex-col md:flex-row md:items-center gap-4">
                        <div class="flex items-center gap-4 flex-1">
                            <div class="w-12 h-12 rounded-full flex items-center justify-center text-white font-bold text-lg shrink-0" style="background: linear-gradient(135deg, #b8dff5, #2d6a9f);">
                                ${(e.writer || '?').charAt(0).toUpperCase()}
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="font-handwrite text-lg truncate" style="color: var(--ink-dark);">${e.writer || 'ไม่ทราบชื่อ'}</p>
                                <p class="text-sm text-gray-500">${formatDate(e.date)}</p>
                            </div>
                        </div>
                        <div class="flex gap-2 pl-14 md:pl-0">
                            <button onclick="viewEntry(${idx})" class="btn-primary text-sm py-2 px-4">อ่าน</button>
                            <button onclick="deleteEntry('${e.id}')" class="btn-danger text-sm py-2 px-4">ลบ</button>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }
        
        // ==================== VIEW ENTRY ====================
        function viewEntry(idx) {
            const e = entries[idx];
            if (!e) return;
            
            document.getElementById('view-avatar').textContent = (e.writer || '?').charAt(0).toUpperCase();
            document.getElementById('view-name').textContent = e.writer || 'ไม่ทราบชื่อ';
            document.getElementById('view-content').textContent = e.content || '(ไม่มีข้อความ)';
            document.getElementById('view-date').textContent = 'วันที่: ' + formatDate(e.date);
            
            if (e.image) {
                document.getElementById('view-image').src = e.image;
                document.getElementById('view-image-container').classList.remove('hidden');
            } else {
                document.getElementById('view-image-container').classList.add('hidden');
            }
            
            document.getElementById('modal-view').classList.add('active');
        }
        
        function hideModal() {
            document.getElementById('modal-view').classList.remove('active');
        }
        
        // ==================== DELETE ENTRY ====================
        function deleteEntry(id) {
            if (confirm('ยืนยันการลบข้อความนี้? ข้อมูลจะหายถาวร')) {
                if (IS_DEMO_MODE || !firebaseReady) {
                    // Delete from localStorage
                    entries = entries.filter(e => e.id !== id);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
                    renderEntries();
                    showToast('ลบสำเร็จ');
                } else {
                    // Delete from Firebase
                    db.ref('entries/' + id).remove()
                        .then(() => showToast('ลบสำเร็จ'))
                        .catch((err) => {
                            console.error(err);
                            showToast('ลบล้มเหลว', 'error');
                        });
                }
            }
        }
        
        // ==================== LOGOUT ====================
        function logout() {
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('admin-password').value = '';
            document.getElementById('login-error').classList.add('hidden');
        }
        
        // ==================== HELPERS ====================
        function formatDate(d) {
            if (!d) return '';
            try {
                return new Date(d).toLocaleDateString('th-TH', {
                    year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
            } catch { return d; }
        }
        
        // ==================== START ====================
        initSystem();
    </script>
</body>
</html>
